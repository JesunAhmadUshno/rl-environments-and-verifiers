name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: scaffold smoke test
        run: python tests/test_smoke.py
      - name: Learn tests
        run: python tests/test_learn_rl.py
      - name: Learn runner
        run: python level-1-learn/run_learn.py
      - name: Build tests
        run: python tests/test_build_rl.py
      - name: Build runner
        run: python level-2-build/run_build.py
      - name: Deep tests
        run: python tests/test_deep_rl.py
      - name: Deep runner
        run: python level-3-deep/run_deep.py
